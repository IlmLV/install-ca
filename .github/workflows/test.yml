name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 1 * *"

jobs:
  # ── Linux / Bash ─────────────────────────────────────────────────────────────
  test-bash:
    name: BATS (Linux - ${{ matrix.distro }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            dockerfile: tests/Dockerfile.ubuntu
            tag: install-ca-cert-bats-ubuntu:ci
          - distro: debian
            dockerfile: tests/Dockerfile.debian
            tag: install-ca-cert-bats-debian:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=bats-${{ matrix.distro }}
          cache-to: type=gha,scope=bats-${{ matrix.distro }},mode=max

      - name: Run BATS tests
        run: docker run --rm ${{ matrix.tag }}

  # ── Windows / Native ────────────────────────────────────────────────────────
  test-windows:
    name: Pester (Windows)
    runs-on: windows-latest
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Run Windows tests
        shell: powershell
        run: Invoke-Pester tests/windows.ps1 -Output Detailed -CI
